<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo Dom</title>
</head>

<style>
    body{
        background-color: rgb(0, 128, 255);
        color: white;
        font: normal 1.5rem arial;
    }
</style>
<body id="pg">
    <h1>Inicando estudos DOM</h1>

    <p>Aqui vai o resultado</p>

    <p>Aprendendo a usar o <strong>DOM</strong> em Javascript</p>

    <div id="msg">
        Clique em mim
    </div>
    <br>

    <script>
        //Seletor por tag
        var p1 = window.document.getElementsByTagName('p')[1]
        window.document.write("Resultado = " + p1.innerText)

        //Seletor por tag - direto
        var corpo = window.document.body
        corpo.style.background = 'gray'

        //Seletor por ID
        var d = document.getElementById('msg')
        d.style.color='blue'

        //Seletor por querySelector "seleciona qualquer elemento"
        var d = document.querySelector('div#msg')
        d.style.color= 'green'
        
        


    </script>
</body>
</html>
